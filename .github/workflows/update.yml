name: Update Terminal

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate ASCII
        run: |
          python scripts/generate_ascii.py

      - name: Generate Terminal
        run: |
          python scripts/generate_terminal.py

      - name: Commit Generated Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update terminal"
          file_pattern: |
            assets/profile-ascii.txt
            assets/terminal.svg